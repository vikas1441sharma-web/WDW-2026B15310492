<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h2 align="center">Student Registration Form</h2>
    <hr>

      <Form action="#" method="post">
        <label for="Name">Full Name:</label>
        <input type="text" id="Name" placeholder="Enter Your Full Name" required>
          <br><br>
          <label for="Email">Email:</label>
          <input type="Email" id="Email" placeholder="Enter Your Email Id" required>
            <br><br>
            <label for="Password">Password</label>
            <input type="Password" id="Password" placeholder="Enter Your Password" required>
              <br><br>
              <label>Gender:</label>
              <br>
              <label for="Male">Male:</label>
              <input type="radio" id="Male" value="Male">

              <label for="Female">Female:</label>
              <input type="radio" id="Female" value="Female">

              <label for="Other">Other</label>
              <input type="radio" id="Other" value="Other">
                <br><br>
                <label for="Course">Course:</label>
                <select id="Course" name="Course" required>
                    <option value="">Select Course</option>
                    <option value="Btech">Btech</option>
                    <option value="BCA">BCA</option>
                    <option value="BBA">BBA</option>
                    <option value="LLB">LLB</option>
                </select>
              
                <br><br>

                <label for="Contact">Contact No:</label>
                <input type="tel" id="Contact" placeholder="Enter Your Phone Number" required>
                <br><br>

                <label for="Address">Address:</label>
                <br>
                <textarea id="Address" placeholder="Enter Your Address" rows="3" cols="30"></textarea>
                <br><br>

                <input type="Submit" value="Ragister">
                <input type="Reset" value="Clear">

      </Form>
                  <br>
                  <hr>
                  <footer align="center">&copy 2026 Student Ragistration Portal</footer>

    
</body>
</html>
