<!DOCTYPE html>

<body> 
    
    <h1>Hotel Room Booking Form</h1>
    <form action="#" method="post"></form>
        <label for="name"> Full Name:</label> 
        <input Type="text" id="Name" placeholder="Enter Your Full Name" required>
        <br><br>
        <label for="Emai">Email</label>
        
        <input type="Email" id="EmaIL" placeholder="Enter Your Email" required>
        <br><br>
        <label for="Phone">Phone:</label>
        <input type="tell" id="phone "placeholder="Enter Your Phone Number" required>
        <br><br>

        <label for="Check-in Date">Check-in Date:</label>
        <input type="Date" id="Check-in" placeholder="Enter Check-in Date" required>
        <br><br>

          <label for="Check-out Date">Check-out Date: </label>
          <input type="Date" id="Check-out" placeholder="Enter Check-out Date" required>
            <br><br>

            <label for="Room-Type">Room Type</label>
            <select id ="Room-Type" name = "Room-Type" required>
                <option value "" >select Room-Type</option>
                <option value="Single">single</option>
                <option value="double">double</option>
                <option value="deluxe">deluxe</option>
                <option value="suite">suite</option>

            </select>
            <br><br>


            <label for="Guests">Number of Guests:</label>
            <input type="number" id="guests" placeholder="Enter Number of Guests" min="1" max="10" required>
            <br><br>
            
            <label for="request">Special Request:</label>
            <br>
            <textarea id="request" placeholder="Enter Your Special Request" rows="2      <" colos="50"></textarea>
            <br><br>
            <input type="submit" value="Book Now">
            <input type="reset" value="Reset Form">





    </form>
</body>
</html>
